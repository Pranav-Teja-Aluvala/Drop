<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Drop — Across screens. Without the detour.</title><desc id="desc">A dark typographic product cover with a postage-style file label addressed from this device to the other device.</desc><rect width="960" height="500" rx="20" fill="#101C2B"/><svg x="48" y="36" width="36" height="44" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 144"><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#25d6ed"/><stop offset="1" stop-color="#1243ff"/></linearGradient><linearGradient id="b" x2=".7" y2="1"><stop stop-color="#3423ff"/><stop offset="1" stop-color="#bc9bff"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#eeeaff"/><stop offset="1" stop-color="#ad87ff"/></linearGradient></defs><path fill="url(#a)" d="M27 3C-2-8-8 41 18 58c24 17 43 5 64-2 17-6 32 2 35 20 8-31-7-54-34-64Z"/><path fill="url(#c)" d="M117 76c-2 22-16 35-36 47L51 81c26-25 61-40 66-5Z"/><path fill="url(#b)" d="M51 77C31 86 8 100 12 120c4 25 28 31 47 17l40-31c6-26-20-43-48-29Z"/></svg>
<g font-family="Arial,sans-serif"><text x="96" y="68" fill="#FFF" font-size="30" font-weight="700">drop</text><text x="912" y="64" text-anchor="end" fill="#A5B9CA" font-size="16" letter-spacing="3">FILES / LINKS / NOTES</text><path d="M48 102H912" stroke="#354456"/><text x="44" y="194" fill="#FFFDF6" font-size="78" font-weight="700" letter-spacing="-4">Across screens.</text><text x="44" y="280" fill="#FFFDF6" font-size="78" font-weight="700" letter-spacing="-4">Without the detour.</text><text x="48" y="330" fill="#B7C5D1" font-size="25">Send it to my other device.</text><path d="M48 380H912" stroke="#354456"/><text x="48" y="426" fill="#D8E4EC" font-size="20">No account. Three devices. One temporary room.</text><text x="48" y="464" fill="#95A8BA" font-size="16">BROWSER TO BROWSER</text><text x="912" y="464" text-anchor="end" fill="#95A8BA" font-size="16">DROP / 02</text></g></svg>