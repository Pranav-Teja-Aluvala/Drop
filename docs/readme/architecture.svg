<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-label="How Drop connects your devices"><title>How Drop connects your devices</title><rect width="800" height="700" rx="24" fill="#F3F1EC"/><g font-family="Segoe UI,Arial,sans-serif" fill="#182E43"><text x="32" y="52" font-size="34">Two paths. One room.</text><rect x="32" y="80" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 104)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect width="64" height="22" rx="5"/><rect y="30" width="64" height="22" rx="5"/><path d="M12 11h2m-2 30h2m27-30h12m-12 30h12"/></g><text x="150" y="123" font-size="26">01 / Load the website</text><text x="150" y="159" font-size="21">Vercel → browsers · HTTPS</text><rect x="32" y="214" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 238)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect width="64" height="22" rx="5"/><rect y="30" width="64" height="22" rx="5"/><path d="M12 11h2m-2 30h2m27-30h12m-12 30h12"/></g><text x="150" y="257" font-size="26">02 / Pair and approve</text><text x="150" y="293" font-size="21">Browsers ↔ Render · HTTPS / WSS</text><rect x="32" y="348" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 372)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect x="12" width="38" height="64" rx="8"/><path d="M25 8h12m-9 48h6"/></g><text x="150" y="391" font-size="26">03 / Send device to device</text><text x="150" y="427" font-size="21">Phone ↔ laptop · encrypted WebRTC</text><rect x="32" y="482" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 506)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><path d="M10 0h30l16 17v47H10Z M40 0v17h16 M20 34h25m-25 12h20"/></g><text x="150" y="525" font-size="26">04 / Verify, then save</text><text x="150" y="561" font-size="21">SHA-256 checks the received file bytes</text><text x="32" y="640" font-size="25">Files and chat bypass the pairing server.</text><text x="32" y="675" font-size="21">No TURN relay on the public service.</text></g></svg>