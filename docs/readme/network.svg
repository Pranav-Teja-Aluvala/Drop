<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Pairing above. Files directly between browsers below."><rect width="900" height="540" rx="18" fill="#F5F4EF"/><g font-family="Arial,sans-serif" fill="#182E43"><text x="38" y="52" font-size="30" font-weight="700">One connection. Two different paths.</text><rect x="265" y="88" width="370" height="112" rx="12" fill="#E4E8EA"/><text x="450" y="128" text-anchor="middle" font-size="24" font-weight="700">Pairing service</text><text x="450" y="164" text-anchor="middle" font-size="20">Approval + connection details</text><path d="M340 200 205 315M560 200 695 315" fill="none" stroke="#7F8F9C" stroke-width="2" stroke-dasharray="6 6"/><text x="130" y="250" font-size="19">HTTPS / WSS</text><text x="650" y="250" font-size="19">HTTPS / WSS</text><rect x="45" y="310" width="250" height="120" rx="12" fill="#182E43"/><rect x="605" y="310" width="250" height="120" rx="12" fill="#182E43"/><text x="170" y="363" text-anchor="middle" fill="#FFF" font-size="27">Your phone</text><text x="170" y="398" text-anchor="middle" fill="#B6C8D7" font-size="19">Approved browser</text><text x="730" y="363" text-anchor="middle" fill="#FFF" font-size="27">Your laptop</text><text x="730" y="398" text-anchor="middle" fill="#B6C8D7" font-size="19">Approved browser</text><path d="M315 370H585m-12-10 12 10-12 10m-246-20-12 10 12 10" fill="none" stroke="#A74A37" stroke-width="3"/><text x="450" y="340" text-anchor="middle" font-size="23" font-weight="700">WebRTC</text><text x="450" y="410" text-anchor="middle" font-size="19">Files + chat</text><text x="450" y="485" text-anchor="middle" font-size="22">File contents bypass the pairing service.</text><text x="450" y="518" text-anchor="middle" font-size="18" fill="#586C7B">Public service: direct connections only; no TURN relay.</text></g></svg>