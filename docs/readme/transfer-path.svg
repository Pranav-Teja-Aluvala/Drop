<svg xmlns="http://www.w3.org/2000/svg" width="800" height="710" viewBox="0 0 800 710" role="img" aria-label="File transfer: offer accept stream verify save"><title>File transfer: offer accept stream verify save</title><rect width="800" height="710" rx="24" fill="#F3F1EC"/><g font-family="Segoe UI,Arial,sans-serif" fill="#182E43"><text x="32" y="52" font-size="32">The journey of an original.</text><rect x="32" y="80" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 104)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect x="12" width="38" height="64" rx="8"/><path d="M25 8h12m-9 48h6"/></g><text x="150" y="123" font-size="26">01 / Choose and offer</text><text x="150" y="159" font-size="21">The sender shares file metadata and hash.</text><rect x="32" y="210" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 234)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect width="66" height="44" rx="5"/><path d="M-8 53h82l-8-9H0Z"/></g><text x="150" y="253" font-size="26">02 / Accept the incoming file</text><text x="150" y="289" font-size="21">Manual approval or the room auto-accept setting.</text><rect x="32" y="340" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 364)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><path d="M10 0h30l16 17v47H10Z M40 0v17h16 M20 34h25m-25 12h20"/></g><text x="150" y="383" font-size="26">03 / Stream the original bytes</text><text x="150" y="419" font-size="21">WebRTC carries binary chunks up to 16 KiB.</text><rect x="32" y="470" width="736" height="112" rx="16" fill="#FFFEFB" stroke="#CDD3CF"/><g transform="translate(58 494)" fill="none" stroke="#335B79" stroke-width="3" stroke-linejoin="round"><rect width="66" height="44" rx="5"/><path d="M-8 53h82l-8-9H0Z"/></g><text x="150" y="513" font-size="26">04 / Check and download</text><text x="150" y="549" font-size="21">A matching SHA-256 hash unlocks Save file.</text><text x="32" y="640" font-size="23">A failed check withholds the download.</text><text x="32" y="678" font-size="21">Integrity checking is not malware scanning.</text></g></svg>